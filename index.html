<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002240">
<title>e-Management Holding TB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --navy:#002240;
  --blue:#0b3b6f;
  --blue-hover:#082d56;
  --blue-soft:#eef4fb;
  --accent:#e8542b;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --green-text:#15803d;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --red-text:#b91c1c;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg:0 20px 25px -5px rgba(15,23,42,.15),0 8px 10px -6px rgba(15,23,42,.1);
  --radius:12px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}
body{
  margin:0;
  font:14px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* SVG Icon Utility */
.ico{
  width:16px;height:16px;
  stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  fill:none;flex-shrink:0;display:inline-block;vertical-align:middle;
}
.ico-lg{width:20px;height:20px}

/* Loading Spinner Overlay */
#bz{
  position:fixed;inset:0;
  background:rgba(15,23,42,.42);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
}
#bz.on{display:flex;animation:fadeIn .15s ease}
.sp-box{
  background:var(--surface);
  padding:20px 26px;
  border-radius:14px;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.sp-ring{
  width:38px;height:38px;
  border:3.5px solid var(--blue-soft);
  border-top-color:var(--blue);
  border-right-color:var(--accent);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
.sp-txt{
  font-size:13px;font-weight:600;color:var(--navy);
}
  
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
header{
  width:100%;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,34,64,.04);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20;
}
header::after{
  content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--blue) 65%,var(--accent) 100%);
}
.brand{
  display:flex;flex-direction:column;align-items:flex-start;
  min-width:0;flex:1;
}
.brand img{
  height:28px;width:auto;max-width:170px;
  object-fit:contain;object-position:left center;
  margin-bottom:4px;display:block;
}
header .tt{
  width:100%;color:var(--navy);
  font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;
}
header .tt small{
  display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* User Account Dropdown */
#hb{position:relative;flex-shrink:0}
.acc-btn{
  padding:8px 12px;font-size:12.5px;font-weight:600;border-radius:9px;
  background:#f8fafc;border:1px solid var(--border-strong);color:var(--navy);
  display:inline-flex;align-items:center;gap:6px;
}
.acc-btn:hover{background:#f1f5f9;border-color:#94a3b8}
.acc-menu{
  position:absolute;right:0;top:calc(100% + 6px);
  min-width:190px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
  box-shadow:var(--shadow-lg);
  padding:6px;
  display:none;
  flex-direction:column;
  gap:2px;
  z-index:25;
}
.acc-menu.open{display:flex;animation:fadeIn .14s ease}
.acc-menu button{
  width:100%;justify-content:flex-start;
  background:transparent;color:var(--text);
  padding:9px 11px;font-size:13px;font-weight:500;border-radius:8px;
}
.acc-menu button:hover{background:#f1f5f9;color:var(--navy)}
.acc-menu button.danger{color:var(--red-text)}
.acc-menu button.danger:hover{background:var(--red-soft)}
.acc-sep{height:1px;background:var(--border);margin:4px 0}

/* Main Container */
main{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:14px 16px;
}

/* Desktop / Laptop Full-Width Layout */
@media(min-width:900px){
  header{
    padding-left:28px;
    padding-right:28px;
  }
  main{
    max-width:100%;
    padding:20px 28px;
  }
  /* Form Input & Auth tetap nyaman dibaca di tengah */
  main.narrow-view{
    max-width:820px;
  }
  /* Grid 2 kolom untuk tampilan Cards di Daftar */
  #ls.cards-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  #ls.cards-grid .item{
    margin-bottom:0;
  }
  #ls.cards-grid .pg-bar{
    grid-column:1 / -1;
    margin-top:0;
  }
  /* Grid 2 kolom untuk kartu ringkasan di Summary */
  #sumBody{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    align-items:start;
  }
  #sumBody .kpi-grid{
    grid-column:1 / -1;
    margin-bottom:0;
  }
  #sumBody .card{
    margin-bottom:0;
  }
  nav button{
    max-width:280px;
  }
}

/* Cards */
.card{
  width:100%;
  max-width:100%;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}

/* Headings */
h2,h3,h4{margin:0 0 12px;color:var(--navy);letter-spacing:-.015em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
h4{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--blue);border-left:3px solid var(--accent);
  padding:2px 0 2px 10px;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;
}
.req-badge{
  font-size:10.5px;font-weight:700;text-transform:none;letter-spacing:0;
  background:var(--red-soft);color:var(--red-text);
  padding:2px 8px;border-radius:999px;
}

/* Forms & Date Field Fix */
label{
  display:block;
  width:100%;
  max-width:100%;
  font-size:12.5px;font-weight:600;
  color:#334155;margin-bottom:12px;
}
label:last-child{margin-bottom:0}
input,select,textarea{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  margin-top:5px;
  padding:10px 12px;
  font:inherit;font-size:14px;
  color:var(--text);background:#fff;
  border:1px solid var(--border-strong);border-radius:9px;
  transition:border-color .15s,box-shadow .15s,background-color .15s;
}
input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  min-height:42px;
  line-height:1.2;
}
input::placeholder,textarea::placeholder{color:#94a3b8}
input:hover,select:hover,textarea:hover{border-color:#94a3b8}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(11,59,111,.14);
}
input[readonly]{
  background:#f8fafc;color:var(--muted);
  border-color:var(--border);cursor:not-allowed;
}
textarea{resize:vertical;min-height:76px}

/* Highlight kolom hasil OCR */
.ocr-filled{
  background:#fefce8 !important;
  border-color:#f59e0b !important;
  box-shadow:0 0 0 3px rgba(245,158,11,.15) !important;
}
.ocr-tag{
  display:inline-block;
  margin-left:6px;
  padding:1px 6px;
  font-size:10px;
  font-weight:700;
  color:#b45309;
  background:#fef3c7;
  border:1px solid #fcd34d;
  border-radius:999px;
  vertical-align:middle;
}

/* Buttons */
button{
  font:inherit;font-size:13.5px;font-weight:600;
  border:1px solid transparent;border-radius:9px;
  padding:10px 14px;cursor:pointer;
  background:var(--blue-soft);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:all .15s ease;
}
button:hover{background:#dce7f7}
button:active{transform:scale(.985)}
button.p{
  background:var(--blue);color:#fff;width:100%;padding:12px 16px;
  font-size:14px;box-shadow:0 2px 6px rgba(11,59,111,.22);
}
button.p:hover{background:var(--blue-hover)}
button.s{
  white-space:nowrap;background:#f8fafc;color:var(--text);
  border-color:var(--border-strong);
}
button.s:hover{background:#f1f5f9;border-color:#94a3b8}
button.d{background:var(--red-soft);color:var(--red-text)}
button.d:hover{background:#fecaca}
button.ex{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
button.ex:hover{background:#d1fae5}

/* Photo Capture & Preview Box */
.photo-box{
  border:1.5px dashed var(--border-strong);
  background:#f8fafc;
  border-radius:10px;
  padding:14px;
  text-align:center;
}
.photo-box.missing{
  border-color:#fca5a5;
  background:#fffafb;
}
.photo-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.photo-preview{
  position:relative;
  margin-bottom:10px;
  border-radius:9px;
  overflow:hidden;
  border:1px solid var(--border);
  background:#0f172a;
}
.photo-preview img{
  display:block;
  width:100%;
  max-height:240px;
  object-fit:contain;
  margin:0 auto;
}
.photo-hint{
  font-size:11.5px;
  color:var(--muted);
  margin-top:8px;
}

/* Row Utility */
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;width:100%}
.row:last-child{margin-bottom:0}
.row>input,.row>select{margin-top:0;flex:1;min-width:0}

/* Toolbar Bar in List */
.list-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:6px;
}
#cnt{
  font-size:12px;font-weight:600;color:var(--muted);
}

/* Custom Searchable Dropdown (Current Location) */
.loc-wrap{position:relative;width:100%}
.loc-dd{
  position:absolute;left:0;right:0;top:calc(100% + 4px);
  max-height:210px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:10px;box-shadow:var(--shadow-lg);
  z-index:35;display:none;padding:4px;
}
.loc-dd.open{display:block;animation:fadeIn .12s ease}
.loc-opt{
  padding:9px 11px;font-size:13.5px;font-weight:500;color:var(--text);
  border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
}
.loc-opt:hover,.loc-opt:active{background:var(--blue-soft);color:var(--navy)}
.loc-opt.new-opt{color:var(--blue);font-weight:600;background:#f8fafc;border-top:1px dashed var(--border-strong);margin-top:2px}

/* View Mode Switcher & Table Layout */
.view-toggle{
  display:inline-flex;
  background:#f1f5f9;
  border:1px solid var(--border-strong);
  border-radius:8px;
  padding:2px;
  gap:2px;
}
.view-toggle button{
  padding:5px 10px;
  font-size:12px;
  font-weight:600;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  border:none;
}
.view-toggle button.active{
  background:var(--surface);
  color:var(--navy);
  box-shadow:0 1px 2px rgba(15,23,42,.1);
}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.part-tbl{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  min-width:640px;
}
.part-tbl th{
  background:var(--navy);
  color:#fff;
  text-align:left;
  padding:10px 12px;
  font-weight:600;
  white-space:nowrap;
}
.part-tbl td{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
.part-tbl tr:last-child td{border-bottom:none}
.part-tbl tbody tr{cursor:pointer;transition:filter .12s}
.part-tbl tbody tr.row-ok{background:#f2fbf5}
.part-tbl tbody tr.row-un{background:#fff5f5}
.part-tbl tbody tr:hover{filter:brightness(.97)}

/* Part List Items (Soft Status Tint) */
.item{
  width:100%;
  background:#fff5f5;
  border:1px solid #fecaca;
  border-left:4px solid var(--red);
  border-radius:var(--radius);
  padding:13px 14px;margin-bottom:10px;
  cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
.item:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
  filter:brightness(.985);
}
.item.ok{
  background:#f2fbf5;
  border-color:#bbf7d0;
  border-left-color:var(--green);
}

/* Pagination Bar */
.pg-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-top:10px;box-shadow:var(--shadow-sm);
}
.pg-size{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.pg-size select{width:auto;margin:0;padding:5px 8px;font-size:12px;border-radius:7px}
.pg-ctrl{display:flex;align-items:center;gap:6px;margin-left:auto}
.pg-ctrl button{padding:5px 10px;font-size:12px;border-radius:7px}
.pg-ctrl button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.pg-info{font-size:12px;font-weight:600;color:var(--navy);padding:0 4px}

/* Summary Dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 10px;box-shadow:var(--shadow-sm);border-top:3px solid var(--navy);
  display:flex;flex-direction:column;justify-content:space-between;min-width:0;
}
.kpi-card.ok{border-top-color:var(--green);background:#f7fcf9}
.kpi-card.un{border-top-color:var(--red);background:#fff8f8}
.kpi-lbl{
  font-size:clamp(9.5px,2.4vw,11px);font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kpi-val{font-size:21px;font-weight:700;color:var(--navy);margin-top:4px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-card.ok .kpi-val{color:var(--green-text)}
.kpi-card.un .kpi-val{color:var(--red-text)}
.kpi-sub{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:500;line-height:1.3}
.sum-row{padding:10px 0;border-bottom:1px solid var(--border)}
.sum-row:last-child{border-bottom:none;padding-bottom:0}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.sum-name{font-weight:700;font-size:13px;color:var(--navy)}
.sum-pills{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700}
.pill-ok{background:var(--green-soft);color:var(--green-text);padding:2px 7px;border-radius:999px}
.pill-un{background:var(--red-soft);color:var(--red-text);padding:2px 7px;border-radius:999px}
.pill-tot{background:#f1f5f9;color:var(--navy);padding:2px 7px;border-radius:999px}
.prog-bar{height:7px;width:100%;background:#fee2e2;border-radius:999px;overflow:hidden;display:flex}
.prog-ok{background:var(--green);height:100%;transition:width .3s ease}
.item .row{justify-content:space-between;align-items:center;margin:0 0 6px}
.item b{
  color:var(--navy);font-size:14.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.item>div:nth-child(2){
  font-size:13.5px;font-weight:500;color:#1e293b;margin-bottom:6px;
  word-break:break-word;
}
.item small{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12px;color:var(--muted);line-height:1.45;
}
.has-photo{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--blue);font-weight:600;font-size:11.5px;flex-shrink:0;
}

/* Status Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--red-soft);color:var(--red-text);white-space:nowrap;flex-shrink:0;
}
.badge::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
}
.badge.ok{background:var(--green-soft);color:var(--green-text)}
.badge.del{background:#f1f5f9;color:#475569}

/* Bottom Navigation */
nav{
  position:fixed;bottom:0;left:0;right:0;
  width:100%;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 10px rgba(15,23,42,.04);
  display:flex;justify-content:center;
  padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  z-index:10;
}
nav button{
  flex:1;max-width:220px;background:none;border:0;border-radius:10px;
  padding:7px 4px;font-size:11.5px;font-weight:600;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;
  position:relative;
}
nav button:hover{background:#f8fafc;color:var(--navy)}
nav button.on{color:var(--blue);background:var(--blue-soft)}
nav button.on::before{
  content:"";position:absolute;top:-4px;width:28px;height:3px;
  border-radius:0 0 4px 4px;background:var(--accent);
}

/* Modal & Bottom Sheet */
#md{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100vh;height:100dvh;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
  padding-top:calc(12px + env(safe-area-inset-top));
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  animation:fadeIn .18s ease;
}
@media(min-width:640px){
  #md{align-items:center;padding:16px}
  .sheet{border-radius:16px !important;max-height:86vh !important;max-height:86dvh !important}
}
.sheet{
  background:var(--surface);width:100%;max-width:640px;
  max-height:calc(100vh - 24px - env(safe-area-inset-top));
  max-height:calc(100dvh - 24px - env(safe-area-inset-top));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  border-radius:18px 18px 0 0;
  padding:14px 18px calc(24px + env(safe-area-inset-bottom));
  position:relative;box-shadow:var(--shadow-lg);
  animation:slideUp .22s cubic-bezier(.16,1,.3,1);
}
.sheet .x{
  position:sticky;top:0;float:right;margin:-4px -6px 4px 10px;
  z-index:5;
  width:34px;height:34px;padding:0;border-radius:50%;
  background:#f1f5f9;color:var(--navy);
  border:1px solid var(--border-strong);
  box-shadow:0 2px 6px rgba(15,23,42,.1);
}
.sheet .x:hover{background:#e2e8f0;color:var(--text)}

/* Sub-Modal Pop-up (Tambah Lokasi Baru) */
#subMd{
  position:fixed;inset:0;
  background:rgba(15,23,42,.58);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);

  const start = el.selectionStart;
  let val = el.value.toUpperCase();
  let removedBefore = 0;
  if (NO_SPACE_IDS.includes(el.id)) {
    if (typeof start === 'number') {
      removedBefore = (val.slice(0, start).match(/\s+/g) || []).join('').length;
    }
    val = val.replace(/\s+/g, '');
  }
  if (el.value !== val) {
    el.value = val;
    if (typeof start === 'number') {
      const pos = Math.max(0, start - removedBefore);
      el.setSelectionRange(pos, pos);
    }
  }

// Kompresi gambar otomatis sebelum diunggah (maks. 1280px, JPEG 78%) agar upload & download cepat
function compressImage(file, maxDim = 1280, quality = 0.78){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith('image/')){
      reject(new Error('File yang dipilih harus berupa gambar'));
      return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width;
        let h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){
            h=Math.round(h*(maxDim/w));
            w=maxDim;
          }else{
            w=Math.round(w*(maxDim/h));
            h=maxDim;
          }
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;
        canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('Gagal memproses file gambar'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('Gagal membaca file gambar'));
    reader.readAsDataURL(file);
  });
}

function field([k,l,t,o],v,req){

  if(t==='sel')return `<label>${l}${mark}<select id=${id}>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
  if(t==='loc_sel')return `<label>${l}${mark}<div class="row" style="margin-bottom:0"><select id=${id}>${buildLocationOptions(v)}</select><button type="button" class="s" id="${id}_add" title="Tambah Lokasi Baru" aria-label="Tambah Lokasi Baru" style="padding:0 13px">${ICO.plusSm}</button></div></label>`;
  if(t==='owner_sel')return `<label>${l}${mark}<div class="row" style="margin-bottom:0"><select id=${id}>${buildOwnerOptions(v)}</select><button type="button" class="s" id="${id}_add" title="Tambah Owner Baru" aria-label="Tambah Owner Baru" style="padding:0 13px">${ICO.plusSm}</button></div></label>`;
  return `<label>${l}${mark}<input id=${id} type=${t||'text'} ${t==='number'?'inputmode=numeric':''} value="${esc(v)}"></label>`;
}

    }).join('')

  renderPhotoWidget(false);
  $('#f_loc_add').onclick=()=>promptAddLocation($('#f_loc'));
  $('#f_owner_add').onclick=()=>promptAddOwner($('#f_owner'));

  // Sinkronisasi daftar lokasi & owner terbaru dari Google Sheets saat membuka form input
  api('locations').then(locs=>{
    if(Array.isArray(locs)){
      locations=locs;
      const curVal=$('#f_loc').value;

    }
  }).catch(()=>{});

  api('owners').then(ownList=>{

      owners=ownList;
      const curVal=$('#f_owner').value;
      $('#f_owner').innerHTML=buildOwnerOptions(curVal);
    }
  }).catch(()=>{});

  // Auto-fill Owner (2) jika A/C REG / NHA (1) cocok dengan database, dan reset jika belum terdaftar
  const acInput=$('#f_ac'),ownerInput=$('#f_owner');
  if(acInput && ownerInput){
    ownerInput.addEventListener('change',()=>{
      delete ownerInput.dataset.autofilled;
    });
    const autoFillOwner=()=>{
      const acVal=acInput.value.trim().toUpperCase();
      if(!acVal){
        if(ownerInput.dataset.autofilled==='1'){
          ownerInput.value='';
          delete ownerInput.dataset.autofilled;
        }
        return;
      }
      const matched=parts.find(item=>String(item.ac||'').trim().toUpperCase()===acVal && String(item.owner||'').trim());
      if(matched){
        const matchedOwner=String(matched.owner).trim().toUpperCase();
        ownerInput.innerHTML=buildOwnerOptions(matchedOwner);
        ownerInput.value=matchedOwner;
        ownerInput.dataset.autofilled='1';
      }else if(ownerInput.dataset.autofilled==='1'){
        ownerInput.value='';
        delete ownerInput.dataset.autofilled;
      }
    };
    acInput.addEventListener('input',autoFillOwner);
    acInput.addEventListener('change',autoFillOwner);
  }

  const clearOcrMarks=()=>{
    app.querySelectorAll('.ocr-filled').forEach(el=>el.classList.remove('ocr-filled'));
    app.querySelectorAll('.ocr-tag').forEach(tag=>tag.remove());
  };

  const markOcrField=el=>{
    if(!el)return;
    el.classList.add('ocr-filled');
    const lbl=el.closest('label');
    if(lbl && !lbl.querySelector('.ocr-tag')){
      const badge=document.createElement('span');
      badge.className='ocr-tag';
      badge.textContent='OCR • Cek Ulang';
      const firstInput=lbl.querySelector('input,select,textarea,.row');
      lbl.insertBefore(badge,firstInput||null);
    }
    const unmark=()=>{
      el.classList.remove('ocr-filled');
      const b=lbl && lbl.querySelector('.ocr-tag');
      if(b)b.remove();
    };
    el.addEventListener('input',unmark,{once:true});
    el.addEventListener('change',unmark,{once:true});
  };

  const applyOcrResult=data=>{
    if(!data || typeof data!=='object')return;
    clearOcrMarks();
    // 'owner' dikeluarkan dari textKeys agar tidak terisi teks mentah dari tag (misal 'GIA') jika A/C Reg belum terdaftar
    const textKeys=['ac','desc','pn','sn','qty','rno','rdet','disc','wno','wdet','rby','dby'];
    if(!edit && data.bc && !$('#f_bc').value.trim()){
      const bcEl=$('#f_bc');
      bcEl.value=String(data.bc).trim().toUpperCase();
      markOcrField(bcEl);
    }
    const noSpaceKeys=['ac','pn','sn','rno','wno'];
    textKeys.forEach(k=>{
      const el=$('#f_'+k);
      if(el && data[k]!=null && String(data[k]).trim()!==''){
        let val=String(data[k]).trim().toUpperCase();
        if(noSpaceKeys.includes(k))val=val.replace(/\s+/g,'');
        el.value=val;
        markOcrField(el);
      }
    });
    // Reset Owner sebelum dicocokkan dengan A/C REG atau daftar master sheet 'owner'
    if(ownerInput){
      ownerInput.value='';
      delete ownerInput.dataset.autofilled;
    }
    ['rdate','ddate'].forEach(k=>{
      const el=$('#f_'+k);
      const val=String(data[k]||'').trim();
      if(el && /^\d{4}-\d{2}-\d{2}$/.test(val)){
        el.value=val;
        markOcrField(el);
      }
    });
    if(data.rtype && RT.includes(data.rtype)){
      const el=$('#f_rtype');
      el.value=data.rtype;
      markOcrField(el);
    }
    if(data.wtype && WT.includes(data.wtype)){
      const el=$('#f_wtype');
      el.value=data.wtype;
      markOcrField(el);
    }
    if(data.status==='Serviceable' || data.status==='Unserviceable'){
      const el=$('#f_status');
      el.value=data.status;
      markOcrField(el);
    }
    if(acInput)acInput.dispatchEvent(new Event('change'));
    // Jika A/C Reg belum terdaftar di database, cocokkan hasil OCR Owner hanya jika persis ada di master sheet 'owner'
    if(ownerInput && !ownerInput.value && data.owner){
      const ocrOwner=String(data.owner).trim().toUpperCase();
      const validOwners=getAllOwners();
      if(validOwners.includes(ocrOwner)){
        ownerInput.value=ocrOwner;
        markOcrField(ownerInput);
      }
    }
    const firstHighlighted=app.querySelector('.ocr-filled');
    if(firstHighlighted)firstHighlighted.scrollIntoView({behavior:'smooth',block:'center'});
  };

  const handleOcrFile=e=>{
    const file=e.target.files && e.target.files[0];
    if(!file)return;
    run(async()=>{
      const compressedTag=await compressImage(file,1600,0.85);
      const extracted=await api('ocr_tag',{image:compressedTag});
      applyOcrResult(extracted);
      toast('OCR selesai! Silakan periksa kembali hasil isian form.');
    }).finally(()=>{e.target.value=''});
  };
  $('#btnOcrCam').onclick=()=>$('#inpOcrCam').click();
  $('#btnOcrGal').onclick=()=>$('#inpOcrGal').click();
  $('#inpOcrCam').onchange=handleOcrFile;
  $('#inpOcrGal').onchange=handleOcrFile;

  const handleFile=async e=>{
    const file=e.target.files && e.target.files[0];
    if(!file)return;
    try{
      photoData=await compressImage(file);
      const estKb=Math.round((photoData.length*3)/4/1024);
      renderPhotoWidget(false);
      toast('Foto siap disimpan (~'+estKb+' KB)');
    }catch(err){
      toast(err.message);
    }finally{
      e.target.value='';
    }
  };
  $('#inpCam').onchange=handleFile;
  $('#inpGal').onchange=handleFile;

  if(!p)$('#sc').onclick=()=>scan(async c=>{
    const code=c.toUpperCase();
    $('#f_bc').value=code;
    const x=parts.find(r=>r.bc===code);
    if(x && await askConfirm({
      title:'Barcode Sudah Terdaftar',
      msg:'Barcode '+code+' sudah ada di database. Buka mode edit untuk memperbarui data part ini?',
      okText:'Edit Data'
    }))go('in',x);
  });

  $('#sv').onclick=()=>run(async()=>{
    const bc=$('#f_bc').value.trim();
    if(!bc)throw new Error('Barcode wajib diisi');
    if(!photoData){
      renderPhotoWidget(true);
      $('#photoWidget').scrollIntoView({behavior:'smooth',block:'center'});
      throw new Error('Foto part wajib diambil terlebih dahulu');
    }
    const optSections=['Pekerjaan (9)','Pengesahan','Sisi Belakang (15), jika perlu'];
    for(const [secTitle,fs] of S){
      if(optSections.includes(secTitle))continue;
      for(const [k,lbl] of fs){
        if(k==='sn')continue;
        const el=$('#f_'+k);
        if(!el || !String(el.value||'').trim()){
          if(el){
            el.scrollIntoView({behavior:'smooth',block:'center'});
            el.focus();
          }
          throw new Error(lbl+' wajib diisi');
        }
      }
    }
    const q={bc,photo:photoData};
    S.forEach(([,fs])=>fs.forEach(([k])=>q[k]=$('#f_'+k).value));
    await api('save',{p:q,isNew:!edit});
    await load();
    toast('Data & foto berhasil disimpan');
    go('list');
  });
}

function downloadBase64File(base64,fileName,mimeType){
  const bin=atob(base64);
  const len=bin.length;
  const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
  const blob=new Blob([bytes],{type:mimeType});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=fileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},500);
}

function openExportModal(){
  const qEl=$('#q');

  const searchVal=(view==='list' && qEl)?qEl.value.trim():'';
  const statusVal=(view==='list' && fsEl)?fsEl.value:'';
  const isOk=st=>/^serviceable$/i.test(String(st||'').trim());

  const hasFilter=Boolean(searchVal || statusVal);
  const filterLabel=[searchVal, statusVal ? (isOk(statusVal)?'SERVICEABLE':'UN-SERVICEABLE') : '']
    .filter(Boolean).join(' - ').toUpperCase();

  let selectedItems=[];
  if(hasFilter){
    const qLow=searchVal.toLowerCase();
    selectedItems=parts.filter(p=>
      (!statusVal || isOk(p.status)===isOk(statusVal)) &&
      (!qLow || [p.bc,p.pn,p.sn,p.desc,p.loc,p.ac].join(' ').toLowerCase().includes(qLow))
    );
  }

  const allLocs=Array.from(new Set([
    ...locations,
    ...parts.map(p=>String(p.loc||'').trim()).filter(Boolean)
  ]));

  modal(`
    <h3>Export Laporan Holding TB</h3>

      <select id="expLoc">
        ${hasFilter?`<option value="SELECTED" selected>${esc(filterLabel)} (${selectedItems.length} part)</option>`:''}

  `);

      throw new Error('Tidak ada data hasil filter/pencarian untuk diexport');

    const payload=loc==='SELECTED'

    downloadBase64File(res.base64,res.fileName,res.mimeType);

    toast('File '+res.fileName+' berhasil diunduh');

          <div class="view-toggle" role="group" aria-label="Mode Tampilan">
            <button type="button" id="modeCards" class="${listMode==='cards'?'active':''}" style="padding:5px 8px;font-size:11.5px;gap:4px">${ICO.grid}<span>Cards</span></button>
            <button type="button" id="modeTable" class="${listMode==='table'?'active':''}" style="padding:5px 8px;font-size:11.5px;gap:4px">${ICO.table}<span>Tabel</span></button>
          </div>
          <button type="button" class="ex" id="btnExport" title="Export Excel / PDF" style="padding:5px 9px;font-size:11.5px;gap:4px;white-space:nowrap">
            ${ICO.download}<span>Export</span>
          </button>
        </div>
      </div>
    </div>
    <div id=ls></div>`;

  curPage=1;
  const isOk=st=>/^serviceable$/i.test(String(st||'').trim());
  const draw=()=>{
    listQuery=$('#q').value;
    listStatus=$('#fs').value;
    const q=listQuery.toLowerCase(),f=listStatus;
    const r=parts.filter(p=>(!f||isOk(p.status)===isOk(f))&&(!q||[p.bc,p.pn,p.sn,p.desc,p.loc,p.ac].join(' ').toLowerCase().includes(q)));
    const total=r.length;
    const totalPages=Math.max(1,Math.ceil(total/pageSize));
    if(curPage>totalPages)curPage=totalPages;
    const startIdx=(curPage-1)*pageSize;
    const paged=r.slice(startIdx,startIdx+pageSize);

    $('#cnt').textContent=total
      ? `${startIdx+1}-${Math.min(startIdx+pageSize,total)} dari ${total} part`
      : '0 part';

    if(!total){
      $('#ls').innerHTML='<div class="card ctr">Belum ada data. Buka menu Input Data untuk menambah part.</div>';
      return;
    }

    const pgHtml=`
      <div class="pg-bar">
        <div class="pg-size">
          <span>Tampilkan</span>
          <select id="pgSel">
            ${[20,50,100].map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="pg-ctrl">
          <button type="button" class="s" id="pgPrev" ${curPage<=1?'disabled':''}>&lsaquo; Prev</button>
          <span class="pg-info">Hal ${curPage} / ${totalPages}</span>
          <button type="button" class="s" id="pgNext" ${curPage>=totalPages?'disabled':''}>Next &rsaquo;</button>
        </div>
      </div>`;

    $('#ls').classList.toggle('cards-grid', listMode==='cards');
    if(listMode==='table'){
      $('#ls').innerHTML=`
        <div class="tbl-wrap">
          <table class="part-tbl">
            <thead>
              <tr>
                <th>Barcode</th>
                <th>A/C Reg</th>
                <th>Description</th>
                <th>Part Number</th>
                <th>Serial Number</th>
                <th>Lokasi</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${paged.map(p=>`
                <tr class="row-item ${isOk(p.status)?'row-ok':'row-un'}" data-bc="${esc(p.bc)}">
                  <td><b>${esc(p.bc)}</b></td>
                  <td>${esc(p.ac)||'-'}</td>
                  <td>${esc(p.desc)||'-'}</td>
                  <td>${esc(p.pn)||'-'}</td>
                  <td>${esc(p.sn)||'-'}</td>
                  <td>${esc(p.loc)||'-'}</td>
                  <td><span class="badge ${isOk(p.status)?'ok':''}">${isOk(p.status)?'Serviceable':'Un-Serviceable'}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>${pgHtml}`;
    }else{
      $('#ls').innerHTML=paged.map(p=>`
        <div class="item ${isOk(p.status)?'ok':''}" data-bc="${esc(p.bc)}">
          <div class=row>
            <b>${esc(p.bc)}</b>
            <span class="badge ${isOk(p.status)?'ok':''}">${isOk(p.status)?'Serviceable':'Un-Serviceable'}</span>
          </div>
          <div>${esc(p.desc)||'-'}</div>
          <small>
            <span>PN ${esc(p.pn)||'-'} | SN ${esc(p.sn)||'-'} | Lokasi: ${esc(p.loc)||'-'}</span>
            ${p.photo?`<span class="has-photo">${ICO.imageSm}<span>Foto</span></span>`:''}
          </small>
        </div>`).join('')+pgHtml;
    }

    $('#pgSel').onchange=e=>{
      pageSize=+e.target.value;
      localStorage.setItem('pageSize',String(pageSize));
      curPage=1;
      draw();
    };
    $('#pgPrev').onclick=()=>{if(curPage>1){curPage--;draw();window.scrollTo({top:0,behavior:'smooth'})}};
    $('#pgNext').onclick=()=>{if(curPage<totalPages){curPage++;draw();window.scrollTo({top:0,behavior:'smooth'})}};
  };

  draw();
  let searchTimer=null;
  $('#q').oninput=()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{curPage=1;draw()},120);
  };
  $('#fs').onchange=()=>{curPage=1;draw()};
  $('#modeCards').onclick=()=>{
    listMode='cards';localStorage.setItem('listMode','cards');
    $('#modeCards').classList.add('active');$('#modeTable').classList.remove('active');
    draw();
  };
  $('#modeTable').onclick=()=>{
    listMode='table';localStorage.setItem('listMode','table');
    $('#modeTable').classList.add('active');$('#modeCards').classList.remove('active');
    draw();
  };
  $('#rf').onclick=()=>run(async()=>{await load();draw()});
  $('#btnExport').onclick=openExportModal;
  $('#ls').onclick=e=>{
    const target=e.target.closest('.item, .row-item');
    if(target)detail(target.dataset.bc);
  };
  $('#sc').onclick=()=>scan(async c=>{
    const code=c.toUpperCase();
    if(parts.some(p=>p.bc===code))detail(code);
    else if(await askConfirm({
      title:'Barcode Belum Terdaftar',
      msg:'Barcode '+code+' belum ditemukan di database. Lanjutkan ke form Input Data sekarang?',
      okText:'Input Sekarang',
      cancelText:'Cari Saja'
    })){go('in');$('#f_bc').value=code}
    else{$('#q').value=code;curPage=1;draw()}
  });
}

function detail(bc){run(async()=>{
  const {p,tl,locations:latestLocs}=await api('get',{bc});
  if(Array.isArray(latestLocs))locations=latestLocs;
  modal(`
    <h3>${esc(p.bc)}</h3>
    <span class="badge ${p.status==='Serviceable'?'ok':''}">${p.status==='Serviceable'?'Serviceable':'Un-Serviceable'}</span>
    ${p.photo?`<div class="detail-photo" id="zoomPhoto"><img src="${esc(p.photo)}" alt="Foto Part ${esc(p.bc)}"></div>`:''}
    <h4 style="margin-top:12px">Update lokasi / status</h4>
    <label>Lokasi saat ini<div class="row" style="margin-bottom:0"><select id=ul>${buildLocationOptions(p.loc)}</select><button type="button" class="s" id="ul_add" title="Tambah Lokasi Baru" aria-label="Tambah Lokasi Baru" style="padding:0 13px">${ICO.plusSm}</button></div></label>
    <label>Status<select id=us><option ${p.status==='Unserviceable'?'selected':''}>Unserviceable</option><option ${p.status==='Serviceable'?'selected':''}>Serviceable</option></select></label>
    <div id="certBox" style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px" hidden>
      <h4 style="margin-bottom:10px"><span>Pengesahan (Wajib untuk Serviceable)</span><span class="req-badge">Wajib</span></h4>
      <label>Removed/Inspected by (10) <span style="color:var(--red)">*</span><input id="u_rby" type="text" value="${esc(p.rby||'')}"></label>
      <label>Date (11) <span style="color:var(--red)">*</span><input id="u_rdate" type="date" value="${esc(p.rdate||'')}"></label>
      <label>Declared Serviceable by (12) <span style="color:var(--red)">*</span><input id="u_dby" type="text" value="${esc(p.dby||'')}"></label>
      <label style="margin-bottom:0">Date (13) <span style="color:var(--red)">*</span><input id="u_ddate" type="date" value="${esc(p.ddate||'')}"></label>
    </div>
    <label>Catatan<input id=un></label>
    <button class=p id=ub>Simpan update</button>
    <h4 style="margin-top:14px">Riwayat pergerakan</h4>
    <div class=tl>${tl.map(t=>`<div><b>${esc(t.loc)||'-'}</b> (${t.st==='Serviceable'?'Serviceable':'Un-Serviceable'})<small>${esc(t.ts)} oleh ${esc(t.by)}${t.note?' | '+esc(t.note):''}</small></div>`).join('')||'<small>Belum ada riwayat</small>'}</div>
    <h4>Data part</h4>
    ${S.map(([,fs])=>fs.filter(([k])=>p[k]&&k!=='status'&&k!=='loc')).filter(a=>a.length).map(fs=>`<dl>${fs.map(([k,l])=>`<dt>${l}</dt><dd>${esc(p[k])}</dd>`).join('')}</dl>`).join('')}
    <small>Dibuat ${esc(p.cby)} ${esc(p.cat)}; diubah ${esc(p.uby)} ${esc(p.uat)}</small>
    <div class=row style="margin-top:12px">
      <button class=s id=ed type=button>${ICO.edit}<span>Edit</span></button>
      <button class=d id=dl type=button>${ICO.trash}<span>Hapus</span></button>
    </div>`);
  $('#ul_add').onclick=()=>promptAddLocation($('#ul'));
  const wasUnserv=!/^serviceable$/i.test(String(p.status||'').trim());
  const toggleCertBox=()=>{
    const needCert=wasUnserv && $('#us').value==='Serviceable';
    $('#certBox').hidden=!needCert;
  };
  toggleCertBox();
  $('#us').onchange=toggleCertBox;

  if($('#zoomPhoto'))$('#zoomPhoto').onclick=()=>window.open(p.photo,'_blank');
  $('#ub').onclick=()=>run(async()=>{
    const newLoc=$('#ul').value.trim();
    if(!newLoc)throw new Error('Lokasi saat ini wajib dipilih');
    const newSt=$('#us').value;
    let cert=null;
    if(wasUnserv && newSt==='Serviceable'){
      const certFields=[
        ['rby','Removed/Inspected by (10)'],
        ['rdate','Date (11)'],
        ['dby','Declared Serviceable by (12)'],
        ['ddate','Date (13)']
      ];
      cert={};
      for(const [k,lbl] of certFields){
        const el=$('#u_'+k);
        if(!el || !String(el.value||'').trim()){
          if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus()}
          throw new Error(lbl+' wajib diisi saat mengubah status menjadi Serviceable');
        }
        cert[k]=el.value.trim();
      }
    }
    await api('track',{bc,loc:newLoc,st:newSt,note:$('#un').value,cert});
    await load();toast('Update tersimpan');closeM();detail(bc);if(view==='list')listView();
  });
  $('#ed').onclick=()=>{closeM();go('in',p)};
  $('#dl').onclick=async()=>{
    if(await askConfirm({
      title:'Hapus Data Part',
      msg:'Yakin ingin menghapus part '+bc+'? Aktivitas penghapusan ini akan dicatat secara permanen pada Audit Trail Admin.',
      okText:'Ya, Hapus',
      danger:true
    }))run(async()=>{await api('del',{bc});await load();closeM();toast('Part berhasil dihapus');go('list')});
  };
})}

let savedScrollY=0;
function lockBodyScroll(){
  if(document.body.style.position==='fixed')return;
  savedScrollY=window.scrollY||window.pageYOffset||0;
  document.body.style.position='fixed';
  document.body.style.top=-savedScrollY+'px';
  document.body.style.left='0';
  document.body.style.right='0';
  document.body.style.width='100%';
  document.body.style.overflow='hidden';
}
function unlockBodyScroll(){
  if(document.body.style.position!=='fixed')return;
  document.body.style.position='';
  document.body.style.top='';
  document.body.style.left='';
  document.body.style.right='';
  document.body.style.width='';
  document.body.style.overflow='';
  window.scrollTo(0,savedScrollY);
}

function modal(h,c){
  closeM();onc=c;
  lockBodyScroll();
  const d=document.createElement('div');
  d.id='md';
  d.innerHTML=`<div class=sheet><button class=x type=button aria-label="Tutup">${ICO.close}</button>${h}</div>`;
  d.querySelector('.x').onclick=closeM;
  d.onclick=e=>{if(e.target===d)closeM()};
  d.addEventListener('touchmove',e=>{
    if(!e.target.closest('.sheet'))e.preventDefault();
  },{passive:false});
  document.body.append(d);
  requestAnimationFrame(()=>{const s=d.querySelector('.sheet');if(s)s.scrollTop=0});
}
function closeM(){
  const d=$('#md');if(d)d.remove();
  unlockBodyScroll();
  if(onc){const f=onc;onc=null;f()}
}

function askConfirm({title='Konfirmasi',msg='',okText='Ya, Lanjutkan',cancelText='Batal',danger=false}){
  return new Promise(resolve=>{
    const oldSub=$('#subMd');
    if(oldSub)oldSub.remove();

    const overlay=document.createElement('div');
    overlay.id='subMd';
    overlay.innerHTML=`
      <div class="sub-box" role="dialog" aria-modal="true">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <h3 style="margin:0;font-size:15.5px">${esc(title)}</h3>
          <button type="button" class="s" id="cfClose" aria-label="Tutup" style="width:30px;height:30px;padding:0;border-radius:50%">${ICO.close}</button>
        </div>
        <p style="font-size:13px;color:#334155;margin:0 0 16px;line-height:1.5">${esc(msg)}</p>
        <div class="row" style="margin:0">
          <button type="button" class="s" id="cfCancel" style="flex:1">${esc(cancelText)}</button>
          <button type="button" class="${danger?'d':'p'}" id="cfOk" style="flex:1;padding:10px 14px">${esc(okText)}</button>
        </div>
      </div>`;

    const finish=val=>{
      overlay.remove();
      resolve(val);
    };

    overlay.onclick=e=>{if(e.target===overlay)finish(false)};
    document.body.append(overlay);
    $('#cfClose').onclick=()=>finish(false);
    $('#cfCancel').onclick=()=>finish(false);
    $('#cfOk').onclick=()=>finish(true);
    requestAnimationFrame(()=>$('#cfOk').focus());
  });
}

function scan(cb){
  modal('<h3>Scan barcode</h3><div id=rd></div><p><small>Arahkan kamera ke barcode. Atau ketik kodenya:</small></p><div class=row><input id=man placeholder="Kode barcode"><button class=s id=ok type=button>OK</button></div>',()=>{const s=sc;sc=null;if(s)s.stop().then(()=>s.clear()).catch(()=>{})});
  let done=0;const fin=t=>{if(done||!t)return;done=1;closeM();cb(String(t).trim())};
  $('#ok').onclick=()=>fin($('#man').value);
  const H=Html5QrcodeSupportedFormats;
  sc=new Html5Qrcode('rd',{formatsToSupport:[H.CODE_128,H.CODE_39,H.CODE_93,H.QR_CODE,H.EAN_13,H.EAN_8,H.ITF,H.UPC_A,H.DATA_MATRIX],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  sc.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.9,320)),height:Math.floor(Math.min(h*.6,130))})},fin,()=>{})
    .catch(()=>{$('#rd').innerHTML='<p style="color:#fff;padding:14px">Kamera tidak bisa dibuka. Izinkan akses kamera di browser, dan pastikan halaman dibuka lewat HTTPS. Anda tetap bisa mengetik kode manual.</p>'});
}

function sumView(){
  const isOk=st=>/^serviceable$/i.test(String(st||'').trim());

  app.innerHTML=`
    <div class="card" style="padding:12px 14px">
      <div class="row" style="margin-bottom:0">
        <select id="sumSt">
          <option value="">Semua Status</option>
          <option value="Serviceable">Serviceable</option>
          <option value="Unserviceable">Un-Serviceable</option>
        </select>
        <button type="button" class="s" id="sumRf" title="Muat Ulang Data">${ICO.refresh}</button>
        <button type="button" class="ex" id="sumExp">${ICO.download}<span>Export</span></button>
      </div>
    </div>
    <div id="sumBody"></div>`;

  const renderSum=()=>{
    const stFilter=$('#sumSt').value;
    const filtered=parts.filter(p=>!stFilter || isOk(p.status)===isOk(stFilter));

    const total=filtered.length;
    const serv=filtered.filter(p=>isOk(p.status)).length;
    const unserv=total-serv;
    const pctServ=total?Math.round((serv/total)*100):0;

    const groupBy=(fn)=>{
      const map=new Map();
      filtered.forEach(p=>{
        const key=fn(p)||'TIDAK DIKETAHUI';
        if(!map.has(key))map.set(key,{name:key,ok:0,un:0,tot:0});
        const g=map.get(key);
        if(isOk(p.status))g.ok++;else g.un++;
        g.tot++;
      });
      return Array.from(map.values()).sort((a,b)=>b.tot-a.tot);
    };

    const renderGroup=(items,filterType)=>items.length
      ? items.map(g=>{
          const pct=g.tot?Math.round((g.ok/g.tot)*100):0;
          return `
            <div class="sum-row" style="cursor:pointer" data-ftype="${filterType}" data-fval="${esc(g.name)}">
              <div class="sum-head">
                <span class="sum-name">${esc(g.name)}</span>
                <div class="sum-pills">
                  ${stFilter!=='Unserviceable'?`<span class="pill-ok">${g.ok} SVC</span>`:''}
                  ${stFilter!=='Serviceable'?`<span class="pill-un">${g.un} UNSVC</span>`:''}
                  <span class="pill-tot">${g.tot}</span>
                </div>
              </div>
              <div class="prog-bar" title="Serviceable ${pct}%">
                <div class="prog-ok" style="width:${pct}%"></div>
              </div>
            </div>`;
        }).join('')
      : '<small style="color:var(--muted)">Tidak ada data untuk filter ini.</small>';

    const byLoc=groupBy(p=>String(p.loc||'').trim().toUpperCase());
    const byAc=groupBy(p=>String(p.ac||'').trim().toUpperCase());
    const byDisc=groupBy(p=>String(p.disc||'').trim().toUpperCase()||'TANPA DISCREPANCY');

    $('#sumBody').innerHTML=`
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-lbl">Total Part</div>
          <div class="kpi-val">${total}</div>
          <div class="kpi-sub">${byLoc.length} Lokasi | ${byAc.length} A/C</div>
        </div>
        <div class="kpi-card ok">
          <div class="kpi-lbl">Serviceable</div>
          <div class="kpi-val">${serv}</div>
          <div class="kpi-sub">${pctServ}% dari total</div>
        </div>
        <div class="kpi-card un">
          <div class="kpi-lbl" title="Un-Serviceable">Unserviceable</div>
          <div class="kpi-val">${unserv}</div>
          <div class="kpi-sub">${total?100-pctServ:0}% dari total</div>
        </div>
      </div>
      <div class="card">
        <h4><span>Ringkasan per Current Location</span><span style="font-size:10.5px;color:var(--muted);text-transform:none;font-weight:500">Klik baris untuk filter</span></h4>
        ${renderGroup(byLoc,'loc')}
      </div>
      <div class="card">
        <h4><span>Ringkasan per A/C Reg / NHA</span><span style="font-size:10.5px;color:var(--muted);text-transform:none;font-weight:500">Klik baris untuk filter</span></h4>
        ${renderGroup(byAc,'ac')}
      </div>
      <div class="card">
        <h4><span>Ringkasan per Discrepancy (8)</span><span style="font-size:10.5px;color:var(--muted);text-transform:none;font-weight:500">Klik untuk rincian</span></h4>
        ${renderGroup(byDisc,'disc')}
      </div>`;
  };

  const openDiscDetailModal=(discName)=>{
    const stFilter=$('#sumSt').value;
    const matched=parts.filter(p=>{
      const dVal=String(p.disc||'').trim().toUpperCase()||'TANPA DISCREPANCY';
      return dVal===discName && (!stFilter || isOk(p.status)===isOk(stFilter));
    });

    const totalD=matched.length;
    const okD=matched.filter(p=>isOk(p.status)).length;
    const unD=totalD-okD;

    modal(`
      <h3 style="margin-bottom:6px">Rincian Discrepancy (8)</h3>
      <div style="background:#f8fafc;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;margin-bottom:12px">
        <div style="font-weight:700;color:var(--navy);font-size:13.5px;word-break:break-word">${esc(discName)}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="pill-tot">Total: ${totalD}</span>
          <span class="pill-ok">${okD} SVC</span>
          <span class="pill-un">${unD} UNSVC</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
        <span style="font-size:12px;font-weight:700;color:var(--muted)">KELOMPOKKAN BERDASARKAN:</span>
        <div class="view-toggle" role="group">
          <button type="button" id="discByLoc" class="active" style="padding:5px 10px;font-size:12px">Location</button>
          <button type="button" id="discByAc" style="padding:5px 10px;font-size:12px">A/C Reg</button>
        </div>
      </div>
      <div id="discBreakdown"></div>
    `);

    const renderBreakdown=(mode)=>{
      const map=new Map();
      matched.forEach(p=>{
        const key=mode==='loc'
          ? (String(p.loc||'').trim().toUpperCase()||'TIDAK DIKETAHUI')
          : (String(p.ac||'').trim().toUpperCase()||'TIDAK DIKETAHUI');
        if(!map.has(key))map.set(key,{name:key,ok:0,un:0,items:[]});
        const g=map.get(key);
        if(isOk(p.status))g.ok++;else g.un++;
        g.items.push(p);
      });
      const groups=Array.from(map.values()).sort((a,b)=>b.items.length-a.items.length);

      $('#discBreakdown').innerHTML=groups.length
        ? groups.map(g=>{
            const pct=g.items.length?Math.round((g.ok/g.items.length)*100):0;
            return `
              <div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff">
                <div class="sum-head">
                  <span class="sum-name">${esc(g.name)}</span>
                  <div class="sum-pills">
                    <span class="pill-ok">${g.ok} SVC</span>
                    <span class="pill-un">${g.un} UNSVC</span>
                    <span class="pill-tot">${g.items.length}</span>
                  </div>
                </div>
                <div class="prog-bar" style="margin-bottom:8px">
                  <div class="prog-ok" style="width:${pct}%"></div>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px">
                  ${g.items.map(item=>`
                    <div class="disc-part-row" data-bc="${esc(item.bc)}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:${isOk(item.status)?'#f2fbf5':'#fff5f5'};border:1px solid ${isOk(item.status)?'#bbf7d0':'#fecaca'};cursor:pointer;font-size:12px">
                      <div style="min-width:0">
                        <b style="color:var(--navy)">${esc(item.bc)}</b>
                        <span style="color:#334155"> &bull; ${esc(item.desc)||'-'}</span>
                        <div style="color:var(--muted);font-size:11px">PN: ${esc(item.pn)||'-'} | ${mode==='loc'?'A/C: '+(esc(item.ac)||'-'):'Loc: '+(esc(item.loc)||'-')}</div>
                      </div>
                      <span class="badge ${isOk(item.status)?'ok':''}" style="font-size:10.5px;padding:2px 8px">${isOk(item.status)?'SVC':'UNSVC'}</span>
                    </div>
                  `).join('')}
                </div>
              </div>`;
          }).join('')
        : '<small style="color:var(--muted)">Tidak ada rincian data.</small>';

      $('#discBreakdown').onclick=ev=>{
        const itemRow=ev.target.closest('.disc-part-row[data-bc]');
        if(!itemRow)return;
        const targetBc=itemRow.dataset.bc;
        closeM();
        detail(targetBc);
      };
    };

    renderBreakdown('loc');
    $('#discByLoc').onclick=()=>{
      $('#discByLoc').classList.add('active');
      $('#discByAc').classList.remove('active');
      renderBreakdown('loc');
    };
    $('#discByAc').onclick=()=>{
      $('#discByAc').classList.add('active');
      $('#discByLoc').classList.remove('active');
      renderBreakdown('ac');
    };
  };

  renderSum();
  $('#sumSt').onchange=renderSum;
  $('#sumRf').onclick=()=>run(async()=>{await load();renderSum();toast('Data diperbarui')});
  $('#sumExp').onclick=openExportModal;

  $('#sumBody').onclick=e=>{
    const row=e.target.closest('.sum-row[data-fval]');
    if(!row)return;
    const ftype=row.dataset.ftype;
    const val=row.dataset.fval;
    if(ftype==='disc'){
      openDiscDetailModal(val);
      return;
    }
    const stFilter=$('#sumSt').value;
    listStatus=stFilter||'';
    listQuery=(val!=='TIDAK DIKETAHUI')?val:'';
    go('list');
  };
}

async function admView(){
  app.innerHTML=`
    <div class=card id=ul>Memuat pengguna...</div>
    <div class=card id=dlog>Memuat log penghapusan...</div>`;
  await run(async()=>{
    const [us,logs]=await Promise.all([api('users'),api('del_logs')]);
    const L={active:'Aktif',pending:'Menunggu',off:'Nonaktif'};
    $('#ul').innerHTML='<h3>Kelola pengguna</h3>'+us.map(u=>`
      <div class=u>
        <div><b>${esc(u.n)}</b><br><small>${esc(u.nip)} | ${u.r==='admin'?'Admin':'User'} | ${L[u.st]||u.st}</small></div>
        <div class=a>
          ${u.st==='pending'?`<button class=ex data-op=approve data-nip="${esc(u.nip)}" title="Setujui Akun" aria-label="Setujui Akun">${ICO.check}</button>`:''}
          <button class=s data-op=reset data-nip="${esc(u.nip)}" title="Reset Password" aria-label="Reset Password">${ICO.key}</button>
          ${u.nip!==me.nip?`
            <button class="${u.st==='off'?'ex':'s'}" data-op=${u.st==='off'?'on':'off'} data-nip="${esc(u.nip)}" title="${u.st==='off'?'Aktifkan Akun':'Nonaktifkan Akun'}" aria-label="${u.st==='off'?'Aktifkan Akun':'Nonaktifkan Akun'}">${u.st==='off'?ICO.userCheck:ICO.userX}</button>
            <button class=d data-op=del data-nip="${esc(u.nip)}" title="Hapus Pengguna" aria-label="Hapus Pengguna">${ICO.trash}</button>
          `:''}
        </div>
      </div>`).join('');

    $('#dlog').innerHTML='<h3>Log Penghapusan Data (Audit Trail)</h3>'+(
      logs.length
        ? logs.map(l=>`
            <div class="log-item">
              <div class="top">
                <b>${esc(l.bc)}</b>
                <span class="badge del">DELETED</span>
              </div>
              <small><b>Dihapus oleh:</b> ${esc(l.by)} pada ${esc(l.ts)}</small>
              <small><b>Lokasi terakhir:</b> ${esc(l.loc)||'-'}</small>
              <small>${esc(l.note)}</small>
            </div>`).join('')
        : '<small>Belum ada riwayat penghapusan data.</small>'
    );

    $('#ul').onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      const {op,nip}=b.dataset;
      if(op==='reset'){
        modal(`
          <h3>Reset Password Pengguna</h3>
          <p style="font-size:12.5px;color:var(--muted);margin-top:-4px">
            Buat password sementara untuk NIP <b>${esc(nip)}</b> (min. 8 karakter, huruf + karakter spesial).
          </p>
          <label>Password Sementara <span style="color:var(--red)">*</span>
            <input id="rstPw" type="password" autocomplete="new-password">
          </label>
          <label>Konfirmasi Password Sementara <span style="color:var(--red)">*</span>
            <input id="rstConf" type="password" autocomplete="new-password">
          </label>
          <div class="row" style="margin-top:14px;margin-bottom:0">
            <button type="button" class="s" id="rstCancel" style="flex:1">Batal</button>
            <button type="button" class="p" id="rstSave" style="flex:1;padding:10px 14px">Reset Password</button>
          </div>
        `);
        $('#rstCancel').onclick=closeM;
        const submitReset=()=>run(async()=>{
          const pw=$('#rstPw').value;
          const cf=$('#rstConf').value;
          if(!/^(?=.*[A-Za-z])(?=.*[^A-Za-z0-9]).{8,64}$/.test(pw)){
            throw new Error('Password minimal 8 karakter, berisi huruf dan karakter spesial');
          }
          if(pw!==cf)throw new Error('Konfirmasi password sementara tidak cocok');
          await api('uact',{nip,op:'reset',pw});
          closeM();
          toast('Password untuk '+nip+' berhasil direset');
          admView();
        });
        $('#rstSave').onclick=submitReset;
        $('#rstConf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submitReset()}};
        requestAnimationFrame(()=>$('#rstPw').focus());
        return;
      }
      if(op==='del'){
        askConfirm({
          title:'Hapus Pengguna',
          msg:'Yakin ingin menghapus akun pengguna dengan NIP '+nip+'? Tindakan ini tidak dapat dibatalkan.',
          okText:'Ya, Hapus Akun',
          danger:true
        }).then(ok=>{
          if(ok)run(async()=>{await api('uact',{nip,op:'del'});toast('Pengguna '+nip+' dihapus');admView()});
        });
        return;
      }
      run(async()=>{await api('uact',{nip,op:op==='approve'?'on':op});toast('Berhasil');admView()});
    };
  });
}

if(me&&tok){
  hdr();
  nav();
  if(parts.length){
    go('list');
    load().then(()=>{
      if(view==='list')listView();
      else if(view==='sum')sumView();
    }).catch(()=>{});
  }else{
    run(load).then(()=>go('list'));
  }
}else authView();
</script></body></html>
