<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002240">
<title>e-Management Holding TB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --navy:#002240;
  --blue:#0b3b6f;
  --blue-hover:#082d56;
  --blue-soft:#eef4fb;
  --accent:#e8542b;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --green-text:#15803d;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --red-text:#b91c1c;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --border-strong:#cbd5e1;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px -2px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg:0 20px 25px -5px rgba(15,23,42,.15),0 8px 10px -6px rgba(15,23,42,.1);
  --radius:12px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font:14px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* Loading Spinner Overlay */
#bz{
  position:fixed;inset:0;
  background:rgba(15,23,42,.42);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
}
#bz.on{display:flex;animation:fadeIn .15s ease}
.sp-box{
  background:var(--surface);
  padding:20px 26px;
  border-radius:14px;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.sp-ring{
  width:38px;height:38px;
  border:3.5px solid var(--blue-soft);
  border-top-color:var(--blue);
  border-right-color:var(--accent);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
.sp-txt{
  font-size:13px;font-weight:600;color:var(--navy);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
header{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 8px rgba(0,34,64,.04);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:10;
}
header::after{
  content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--blue) 65%,var(--accent) 100%);
}
.brand{
  display:flex;flex-direction:column;align-items:flex-start;
  min-width:0;flex:1;
}
.brand img{
  height:28px;width:auto;max-width:170px;
  object-fit:contain;object-position:left center;
  margin-bottom:4px;display:block;
}
header .tt{
  width:100%;color:var(--navy);
  font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;
}
header .tt small{
  display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#hb{display:flex;align-items:center;gap:6px;flex-shrink:0}
#hb button{
  padding:7px 11px;font-size:12px;border-radius:8px;
  background:#f8fafc;border:1px solid var(--border);color:var(--text);
}
#hb button:hover{background:#f1f5f9;border-color:var(--border-strong)}
#hb #lo{color:var(--red-text);background:var(--red-soft);border-color:transparent}
#hb #lo:hover{background:#fecaca}

/* Main Container */
main{max-width:680px;margin:0 auto;padding:14px 16px}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}

/* Headings */
h2,h3,h4{margin:0 0 12px;color:var(--navy);letter-spacing:-.015em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
h4{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--blue);border-left:3px solid var(--accent);
  padding:2px 0 2px 10px;margin-bottom:12px;
}

/* Forms */
label{
  display:block;font-size:12.5px;font-weight:600;
  color:#334155;margin-bottom:12px;
}
label:last-child{margin-bottom:0}
input,select,textarea{
  display:block;width:100%;margin-top:5px;
  padding:10px 12px;font:inherit;font-size:14px;
  color:var(--text);background:#fff;
  border:1px solid var(--border-strong);border-radius:9px;
  transition:border-color .15s,box-shadow .15s,background-color .15s;
}
input::placeholder,textarea::placeholder{color:#94a3b8}
input:hover,select:hover,textarea:hover{border-color:#94a3b8}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(11,59,111,.14);
}
input[readonly]{
  background:#f8fafc;color:var(--muted);
  border-color:var(--border);cursor:not-allowed;
}
textarea{resize:vertical;min-height:76px}

/* Buttons */
button{
  font:inherit;font-size:13.5px;font-weight:600;
  border:1px solid transparent;border-radius:9px;
  padding:10px 14px;cursor:pointer;
  background:var(--blue-soft);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s ease;
}
button:hover{background:#dce7f7}
button:active{transform:scale(.985)}
button.p{
  background:var(--blue);color:#fff;width:100%;padding:12px 16px;
  font-size:14px;box-shadow:0 2px 6px rgba(11,59,111,.22);
}
button.p:hover{background:var(--blue-hover)}
button.s{
  white-space:nowrap;background:#f8fafc;color:var(--text);
  border-color:var(--border-strong);
}
button.s:hover{background:#f1f5f9;border-color:#94a3b8}
button.d{background:var(--red-soft);color:var(--red-text)}
button.d:hover{background:#fecaca}

/* Row Utility */
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row>input,.row>select{margin-top:0;flex:1;min-width:0}

/* Count Indicator */
#cnt{
  display:inline-block;margin-top:4px;
  font-size:12px;font-weight:600;color:var(--muted);
}

/* Part List Items */
.item{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:4px solid var(--accent);
  border-radius:var(--radius);
  padding:13px 14px;margin-bottom:10px;
  cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.item:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
  border-color:var(--border-strong);
}
.item.ok{border-left-color:var(--green)}
.item .row{justify-content:space-between;align-items:center;margin:0 0 6px}
.item b{
  color:var(--navy);font-size:14.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.item>div:nth-child(2){
  font-size:13.5px;font-weight:500;color:#1e293b;margin-bottom:6px;
}
.item small{
  display:block;font-size:12px;color:var(--muted);line-height:1.45;
}

/* Status Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--red-soft);color:var(--red-text);white-space:nowrap;
}
.badge::before{
  content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
}
.badge.ok{background:var(--green-soft);color:var(--green-text)}

/* Bottom Navigation */
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 10px rgba(15,23,42,.04);
  display:flex;justify-content:center;
  padding:4px 8px calc(4px + env(safe-area-inset-bottom));
  z-index:10;
}
nav button{
  flex:1;max-width:220px;background:none;border:0;border-radius:10px;
  padding:7px 4px;font-size:11.5px;font-weight:600;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;
  position:relative;
}
nav button:hover{background:#f8fafc;color:var(--navy)}
nav button.on{color:var(--blue);background:var(--blue-soft)}
nav button.on::before{
  content:"";position:absolute;top:-4px;width:28px;height:3px;
  border-radius:0 0 4px 4px;background:var(--accent);
}

/* Modal & Bottom Sheet */
#md{
  position:fixed;inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  z-index:30;display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s ease;
}
@media(min-width:640px){
  #md{align-items:center;padding:16px}
  .sheet{border-radius:16px !important;max-height:88vh !important}
}
.sheet{
  background:var(--surface);width:100%;max-width:640px;max-height:92vh;
  overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  position:relative;box-shadow:var(--shadow-lg);
  animation:slideUp .22s cubic-bezier(.16,1,.3,1);
}
.sheet .x{
  position:absolute;right:14px;top:14px;
  width:32px;height:32px;padding:0;border-radius:50%;
  background:#f1f5f9;color:var(--muted);font-size:14px;
}
.sheet .x:hover{background:#e2e8f0;color:var(--text)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:.6}to{transform:translateY(0);opacity:1}}

/* Barcode Scanner Box */
#rd{
  width:100%;min-height:220px;background:#0f172a;
  border-radius:10px;overflow:hidden;border:1px solid var(--border-strong);
  margin-bottom:10px;
}

/* Detail Definition List */
dl{
  margin:0 0 12px;padding:10px 12px;
  background:#f8fafc;border:1px solid var(--border);border-radius:9px;
  display:grid;grid-template-columns:44% 1fr;gap:6px 10px;font-size:13px;
}
dt{color:var(--muted);font-weight:500}
dd{margin:0;color:var(--text);font-weight:600;word-break:break-word}

/* Timeline */
.tl{
  border-left:2px solid var(--border-strong);
  margin:8px 0 16px 8px;padding-left:16px;
}
.tl div{
  margin-bottom:12px;font-size:13.5px;position:relative;
  background:#f8fafc;border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;
}
.tl div:last-child{margin-bottom:0}
.tl div::before{
  content:"";position:absolute;left:-22px;top:12px;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid #fff;
  box-shadow:0 0 0 2px var(--accent);
}
.tl small{color:var(--muted);display:block;margin-top:3px;font-size:12px}

/* Links & Helpers */
.ctr{text-align:center}
a{color:var(--blue);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}

/* Toast Notification */
#ts{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--navy);color:#fff;font-size:13px;font-weight:500;
  padding:10px 18px;border-radius:999px;
  box-shadow:var(--shadow-lg);z-index:40;max-width:90%;
  text-align:center;display:none;
}

/* Admin User List */
.u{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.u:last-child{border-bottom:none;padding-bottom:0}
.u b{color:var(--navy);font-size:14px}
.u small{color:var(--muted);font-size:12px}
.u .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.u button{padding:6px 10px;font-size:12px;border-radius:7px}
</style></head><body>
<div id="bz" aria-live="polite" aria-busy="true">
  <div class="sp-box">
    <div class="sp-ring"></div>
    <div class="sp-txt">Memuat data...</div>
  </div>
</div>
<header>
  <div class="brand">
    <img src="https://lh3.googleusercontent.com/d/1YNUsjvIM5h6r0xlXyOhHwjdmAYwFYWaJ" onerror="this.onerror=null;this.src='https://drive.google.com/uc?export=view&id=1YNUsjvIM5h6r0xlXyOhHwjdmAYwFYWaJ'" alt="GMF AeroAsia">
    <div class="tt">e-Management Holding TB<small id="who"></small></div>
  </div>
  <span id="hb"></span>
</header>
<main id="app"></main><nav id="nav"></nav><div id="ts"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwQdxucpnHWW5fVRm0ddp3xuoHyKBW0JdbmSxtq3yT5PpDnzXArEG4FuJ3YC6465Qw3/exec'; // contoh: https://script.google.com/macros/s/XXXX/exec
const WA='https://wa.me/6281318427266';
const RT=['','Inspection/Repair/Bench Check/Overhaul/Modification/Test/Others','Temporary Storage'];
const WT=['','Inspection','Repair','Bench Check','Overhaul','Modification','Test','Calibration','Cleaning','Others'];
const S=[
['Identitas Part',[['ac','A/C REG / NHA (1)'],['owner','Owner (2)'],['desc','Description (3)'],['pn','Part Number (4)'],['sn','Serial Number (5)'],['qty','Qty (6)','number']]],
['Alasan Pelepasan (7)',[['rno','Order/Jobcard/MDR/PD Sheet No (7.a)'],['rtype','Jenis (7.b)','sel',RT],['rdet','Keterangan (7.b)']]],
['Kondisi',[['disc','Discrepancy / Condition (8)','area']]],
['Pekerjaan (9)',[['wno','Order/Jobcard/MDR/PD Sheet No (9.a)'],['wtype','Jenis (9.b)','sel',WT],['wdet','Keterangan (9.b)']]],
['Pengesahan',[['rby','Removed/Inspected by (10)'],['rdate','Date (11)','date'],['dby','Declared Serviceable by (12)'],['ddate','Date (13)','date']]],
['Status & Lokasi',[['status','Serviceable / Un-Serviceable (14)','sel',['Unserviceable','Serviceable']],['loc','Current Location']]],
['Sisi Belakang (15), jika perlu',[['pos','Pos'],['ref','Reference'],['tsn','TSN/CSN'],['tso','TSO/CSO'],['tbo','TBO'],['bdisc','Discrepancy','area']]]];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let tok=localStorage.getItem('tok'),me=JSON.parse(localStorage.getItem('me')||'null'),parts=[],view='list',edit=null,sc=null,onc=null;

function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)}
async function api(a,d){
 if(!/^https:/.test(API))throw new Error('URL Apps Script belum diisi di index.html');
 const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:tok,d})}),j=await r.json();
 if(!j.ok){if(/^Sesi/.test(j.e))logout(true);throw new Error(j.e)}return j.d}
async function run(fn){$('#bz').classList.add('on');try{return await fn()}catch(e){toast(e.message)}finally{$('#bz').classList.remove('on')}}
const load=async()=>{parts=await api('list')};

function logout(q){tok=null;me=null;localStorage.removeItem('tok');localStorage.removeItem('me');hdr();nav();authView();if(q)toast('Sesi habis, silakan login ulang')}
function hdr(){$('#who').textContent=me?me.n+' ('+me.nip+')':'';$('#hb').innerHTML=me?'<button id=cp>🔑</button> <button id=lo>Keluar</button>':'';
 if(me){$('#lo').onclick=()=>logout();$('#cp').onclick=()=>{const o=prompt('Password lama:');if(!o)return;const n=prompt('Password baru (min. 8, huruf + karakter spesial):');if(n)run(async()=>{await api('chpw',{old:o,pw:n});toast('Password diganti')})}}}
function nav(){$('#nav').innerHTML=me?[['in','➕','Input Data'],['list','📋','Daftar'],...(me.r==='admin'?[['adm','⚙️','Admin']]:[])].map(([k,i,l])=>`<button class="${view===k?'on':''}" data-v=${k}>${i}<br>${l}</button>`).join(''):''}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
function go(v,p){view=v;nav();({in:()=>inView(p),list:listView,adm:admView})[v]();scrollTo(0,0)}

function authView(reg){
 app.innerHTML=`<div class=card style="margin-top:24px"><h2>${reg?'Daftar akun':'Masuk'}</h2>
 <label>Nomor pegawai<input id=nip inputmode=text autocomplete=username></label>
 ${reg?'<label>Nama lengkap<input id=nm></label>':''}
 <label>Password<input id=pw type=password autocomplete=${reg?'new-password':'current-password'}></label>
 ${reg?'<p><small>Minimal 8 karakter, berisi huruf (a-z) dan karakter spesial.</small></p>':''}
 <button class=p id=go>${reg?'Daftar':'Masuk'}</button>
 <p class=ctr><a href=# id=sw>${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</a></p>
 <p class=ctr><small>Lupa password? <a href="${WA}" target=_blank rel=noopener>Hubungi admin via WhatsApp</a></small></p></div>`;
 $('#sw').onclick=e=>{e.preventDefault();authView(!reg)};
 $('#go').onclick=()=>run(async()=>{
  const nip=$('#nip').value.trim(),pw=$('#pw').value;
  if(reg){if(!/^(?=.*[A-Za-z])(?=.*[^A-Za-z0-9]).{8,}$/.test(pw))throw new Error('Password minimal 8 karakter, berisi huruf dan karakter spesial');
   toast(await api('register',{nip,n:$('#nm').value,pw}));authView();return}
  const r=await api('login',{nip,pw});tok=r.t;me=r.u;localStorage.setItem('tok',tok);localStorage.setItem('me',JSON.stringify(me));
  hdr();await load();go('list')})}

function field([k,l,t,o],v){const id='f_'+k;v=v||'';
 if(t==='area')return `<label>${l}<textarea id=${id} rows=3>${esc(v)}</textarea></label>`;
 if(t==='sel')return `<label>${l}<select id=${id}>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
 return `<label>${l}<input id=${id} type=${t||'text'} ${t==='number'?'inputmode=numeric':''} value="${esc(v)}"></label>`}

function inView(p){
 edit=p||null;const v=p||{status:'Unserviceable',qty:'1'};
 app.innerHTML=`<div class=card><h3>${p?'Edit part':'Input part baru'}</h3><label>Part Identification Code (barcode)<div class=row><input id=f_bc value="${esc(v.bc||'')}" ${p?'readonly':''}>${p?'':'<button class=s id=sc>📷 Scan</button>'}</div></label></div>`
 +S.map(([t,fs])=>`<div class=card><h4>${t}</h4>${fs.map(f=>field(f,v[f[0]])).join('')}</div>`).join('')
 +`<button class=p id=sv>Simpan</button>`;
 if(!p)$('#sc').onclick=()=>scan(c=>{$('#f_bc').value=c;const x=parts.find(r=>r.bc===c);if(x&&confirm('Barcode sudah terdaftar. Edit data part ini?'))go('in',x)});
 $('#sv').onclick=()=>run(async()=>{const q={bc:$('#f_bc').value.trim()};S.forEach(([,fs])=>fs.forEach(([k])=>q[k]=$('#f_'+k).value));
  await api('save',{p:q,isNew:!edit});await load();toast('Data tersimpan');go('list')})}

function listView(){
 app.innerHTML=`<div class=card><div class=row><input id=q placeholder="Cari barcode / PN / SN / lokasi" type=search><button class=s id=sc>📷 Scan</button></div>
 <div class=row><select id=fs><option value="">Semua status</option><option>Serviceable</option><option>Unserviceable</option></select><button class=s id=rf>Muat ulang</button></div><small id=cnt></small></div><div id=ls></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase(),f=$('#fs').value;
  const r=parts.filter(p=>(!f||p.status===f)&&(!q||[p.bc,p.pn,p.sn,p.desc,p.loc,p.ac].join(' ').toLowerCase().includes(q)));
  $('#cnt').textContent=r.length+' part';
  $('#ls').innerHTML=r.map(p=>`<div class="item ${p.status==='Serviceable'?'ok':''}" data-bc="${esc(p.bc)}"><div class=row><b>${esc(p.bc)}</b><span class="badge ${p.status==='Serviceable'?'ok':''}">${p.status==='Serviceable'?'Serviceable':'Un-Serviceable'}</span></div><div>${esc(p.desc)||'-'}</div><small>PN ${esc(p.pn)||'-'} | SN ${esc(p.sn)||'-'} | Lokasi: ${esc(p.loc)||'-'}</small></div>`).join('')||'<div class="card ctr">Belum ada data. Buka menu Input Data untuk menambah part.</div>'};
 draw();$('#q').oninput=draw;$('#fs').onchange=draw;
 $('#rf').onclick=()=>run(async()=>{await load();draw()});
 $('#ls').onclick=e=>{const i=e.target.closest('.item');if(i)detail(i.dataset.bc)};
 $('#sc').onclick=()=>scan(c=>{if(parts.some(p=>p.bc===c))detail(c);else if(confirm('Barcode '+c+' belum terdaftar. Input sekarang?')){go('in');$('#f_bc').value=c}else $('#q').value=c,draw()})}

function detail(bc){run(async()=>{
 const {p,tl}=await api('get',{bc}),adm=me.r==='admin';
 modal(`<h3>${esc(p.bc)}</h3><span class="badge ${p.status==='Serviceable'?'ok':''}">${p.status==='Serviceable'?'Serviceable':'Un-Serviceable'}</span>
 <h4 style="margin-top:12px">Update lokasi / status</h4>
 <label>Lokasi saat ini<input id=ul value="${esc(p.loc)}"></label>
 <label>Status<select id=us><option ${p.status==='Unserviceable'?'selected':''}>Unserviceable</option><option ${p.status==='Serviceable'?'selected':''}>Serviceable</option></select></label>
 <label>Catatan<input id=un></label><button class=p id=ub>Simpan update</button>
 <h4 style="margin-top:14px">Riwayat pergerakan</h4><div class=tl>${tl.map(t=>`<div><b>${esc(t.loc)||'-'}</b> (${t.st==='Serviceable'?'Serviceable':'Un-Serviceable'})<small>${esc(t.ts)} oleh ${esc(t.by)}${t.note?' | '+esc(t.note):''}</small></div>`).join('')||'<small>Belum ada riwayat</small>'}</div>
 <h4>Data part</h4>${S.map(([,fs])=>fs.filter(([k])=>p[k]&&k!=='status'&&k!=='loc')).filter(a=>a.length).map(fs=>`<dl>${fs.map(([k,l])=>`<dt>${l}</dt><dd>${esc(p[k])}</dd>`).join('')}</dl>`).join('')}
 <small>Dibuat ${esc(p.cby)} ${esc(p.cat)}; diubah ${esc(p.uby)} ${esc(p.uat)}</small>
 <div class=row style="margin-top:12px"><button class=s id=ed>✏️ Edit</button>${adm?'<button class=d id=dl>🗑 Hapus</button>':''}</div>`);
 $('#ub').onclick=()=>run(async()=>{await api('track',{bc,loc:$('#ul').value,st:$('#us').value,note:$('#un').value});await load();toast('Update tersimpan');closeM();detail(bc);if(view==='list')listView()});
 $('#ed').onclick=()=>{closeM();go('in',p)};
 if(adm)$('#dl').onclick=()=>{if(confirm('Hapus part '+bc+'?'))run(async()=>{await api('del',{bc});await load();closeM();toast('Part dihapus');go('list')})}})}

function modal(h,c){closeM();onc=c;const d=document.createElement('div');d.id='md';d.innerHTML=`<div class=sheet><button class=x>✕</button>${h}</div>`;d.querySelector('.x').onclick=closeM;document.body.append(d)}
function closeM(){const d=$('#md');if(d)d.remove();if(onc){const f=onc;onc=null;f()}}
function scan(cb){
 modal('<h3>Scan barcode</h3><div id=rd></div><p><small>Arahkan kamera ke barcode. Atau ketik kodenya:</small></p><div class=row><input id=man placeholder="Kode barcode"><button class=s id=ok>OK</button></div>',()=>{const s=sc;sc=null;if(s)s.stop().then(()=>s.clear()).catch(()=>{})});
 let done=0;const fin=t=>{if(done||!t)return;done=1;closeM();cb(String(t).trim())};
 $('#ok').onclick=()=>fin($('#man').value);
 const H=Html5QrcodeSupportedFormats;
 sc=new Html5Qrcode('rd',{formatsToSupport:[H.CODE_128,H.CODE_39,H.CODE_93,H.QR_CODE,H.EAN_13,H.EAN_8,H.ITF,H.UPC_A,H.DATA_MATRIX],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
 sc.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.9,320)),height:Math.floor(Math.min(h*.6,130))})},fin,()=>{})
  .catch(()=>{$('#rd').innerHTML='<p style="color:#fff;padding:14px">Kamera tidak bisa dibuka. Izinkan akses kamera di browser, dan pastikan halaman dibuka lewat HTTPS. Anda tetap bisa mengetik kode manual.</p>'})}

async function admView(){
 app.innerHTML='<div class=card id=ul>Memuat pengguna...</div>';
 await run(async()=>{const us=await api('users'),L={active:'Aktif',pending:'Menunggu',off:'Nonaktif'};
  $('#ul').innerHTML='<h3>Kelola pengguna</h3>'+us.map(u=>`<div class=u><div><b>${esc(u.n)}</b><br><small>${esc(u.nip)} | ${u.r==='admin'?'Admin':'User'} | ${L[u.st]||u.st}</small></div><div class=a>
  ${u.st==='pending'?`<button data-op=approve data-nip="${esc(u.nip)}">Setujui</button>`:''}
  <button data-op=reset data-nip="${esc(u.nip)}">Reset password</button>
  ${u.nip!==me.nip?`<button data-op=${u.st==='off'?'on':'off'} data-nip="${esc(u.nip)}">${u.st==='off'?'Aktifkan':'Nonaktifkan'}</button><button class=d data-op=del data-nip="${esc(u.nip)}">Hapus</button>`:''}</div></div>`).join('');
  $('#ul').onclick=e=>{const b=e.target.closest('button');if(!b)return;const {op,nip}=b.dataset;let pw;
   if(op==='reset'){pw=prompt('Password sementara untuk '+nip+' (min. 8, huruf + karakter spesial):');if(!pw)return}
   if(op==='del'&&!confirm('Hapus pengguna '+nip+'?'))return;
   run(async()=>{await api('uact',{nip,op:op==='approve'?'on':op,pw});toast('Berhasil');admView()})}})}

if(me&&tok){hdr();nav();run(load).then(()=>go('list'))}else authView();
</script></body></html>
